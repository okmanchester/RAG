name: rag-search
services:
  elasticsearch:
    # Elasticsearch 9.5.5, official Docker Hub mirror; deliberately pinned digest.
    image: elasticsearch:9.5.5@sha256:33cae13fc18ef105e960cdd32327d402fbd7c6d4376c0b879ad703ee289d45d8
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ingest.geoip.downloader.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set a unique password in .env.elasticsearch}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 3g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail --user \"elastic:$$ELASTIC_PASSWORD\" 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 45s
volumes:
  elasticsearch_data:
